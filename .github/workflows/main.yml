name: Build Automation Edit APK

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout project
    uses: actions/checkout@v4

  - name: Install Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Extract Android project
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip
      unzip -q automation-edit.zip -d source

  - name: Build APK
    run: |
      PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
      if [ -z "$PROJECT_DIR" ]; then
        echo "Android project settings.gradle.kts not found"
        exit 1
      fi
      cd "$PROJECT_DIR"
      gradle :app:assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Automation-Edit-APK
      path: source/**/app/build/outputs/apk/debug/*.apk
